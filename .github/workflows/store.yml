name: Free Microsoft Store package validation
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Private draft release containing Ringfile-Store-preparation.zip
        required: true
        type: string
      preparation_asset:
        description: Preparation ZIP asset in the draft release
        required: true
        default: Ringfile-Store-preparation.zip
        type: string
permissions:
  contents: read
jobs:
  msix:
    if: github.event.repository.private == false
    runs-on: windows-11-arm
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STORE_DRAFT: ${{ inputs.draft_release }}
      STORE_PREPARATION: ${{ inputs.preparation_asset }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download the tested desktop app and Store preparation files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory stable,prep | Out-Null
          gh release download v0.2.0 -D stable -p 'Ringfile-0.2.0-Windows-x64.zip'
          if ($env:STORE_PREPARATION -notmatch '^Ringfile-Store-preparation(?:-[0-9]+)?\.zip$') { throw 'Unexpected preparation filename' }
          gh release download $env:STORE_DRAFT -D prep -p $env:STORE_PREPARATION
          Expand-Archive (Join-Path prep $env:STORE_PREPARATION) -DestinationPath payload
      - name: Build unsigned submission-format MSIX and test an isolated copy
        shell: pwsh
        run: |
          if (Test-Path payload/identity.json) { ./payload/ci/build-verify.ps1 -IdentityFile payload/identity.json }
          else { ./payload/ci/build-verify.ps1 }
      - name: Preserve unsigned package and honest verification results in draft
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem out/*.msix,out/*.json,out/*.xml,out/*.html,out/*.png -ErrorAction SilentlyContinue | ForEach-Object { gh release upload $env:STORE_DRAFT $_.FullName --clobber }
